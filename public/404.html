<!DOCTYPE html>

  <style>
    :root {
      color-scheme: dark;
    }
    html, body {
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      background: #0a0a0b;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 32px;

      text-transform: uppercase;

    }
    .actions {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 8px;
    }
    a.btn {
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 24px;
    }
    a.btn--primary {
      color: #0a0a0b;
      background: #e85d34;
    }
    a.btn--quiet {
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.25);
